<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>夏日城市清爽节｜识别问题待处理</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #172026;
      --muted: #68737d;
      --line: #d9dee5;
      --accent: #0f766e;
      --risk: #b42318;
      --warn: #b54708;
      --ok: #067647;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0; font-size: 20px; }
    h2 { margin: 0 0 14px; font-size: 22px; }
    h3 { margin: 20px 0 10px; font-size: 16px; }
    h4 { margin: 16px 0 8px; font-size: 14px; }
    .layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 20px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }
    nav {
      position: sticky;
      top: 74px;
      align-self: start;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }
    nav a {
      display: block;
      padding: 9px 10px;
      border-radius: 6px;
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
    }
    nav a:hover { background: #eef6f4; color: var(--accent); }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .metric {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }
    .metric { background: #edf2f7; color: var(--ink); }
    section p, section li { font-size: 15px; }
    section li { margin: 6px 0; }
    section ul { padding-left: 22px; }
    code { background: #f1f5f9; padding: 1px 4px; border-radius: 4px; }
    .review-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    .download { background: var(--accent); color: #fff; border-color: var(--accent); }
    textarea {
      width: 100%;
      min-height: 150px;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .muted { color: var(--muted); }
    @media (max-width: 820px) {
      header { align-items: flex-start; flex-direction: column; }
      .layout { grid-template-columns: 1fr; padding: 12px; }
      nav { position: static; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>夏日城市清爽节｜识别问题待处理</h1>
      <div class="summary">
        <span class="metric">自动通过，无需人工处理</span>
        <span class="metric">待处理问题：0</span>
      </div>
    </div>
    <button class="download" onclick="downloadDecisions()">导出确认意见</button>
  </header>
  <div class="layout">
    <nav><a href="#exceptions">需要处理的问题</a>
<a href="#context">文件大纲参考</a></nav>
    <main>
      <section id="how-to-review">
        <h2>处理规则</h2>
        <ul>
          <li>没有识别异常的文件默认自动进入结构化知识库，不需要逐项确认。</li>
          <li>只有图片、表格、小字、漏读、关键业务字段不明确等问题需要你处理。</li>
          <li>如果确实有问题，在底部写明页码、错误点和正确说法。</li>
        </ul>
        <textarea id="decision-json" readonly>{&quot;文件&quot;: &quot;夏日城市清爽节&quot;, &quot;确认意见&quot;: {}}</textarea>
      </section>
      <section id="exceptions"><h2>需要处理的问题</h2><p>这份文件当前没有识别异常需要人工处理，可以先进入结构化知识库。</p>
    <div class="review-controls" data-section="exceptions">
      <button onclick="setDecision('exceptions', '无需处理')">无需处理</button>
      <button onclick="setDecision('exceptions', '已补充修正')">已补充修正</button>
      <button onclick="setDecision('exceptions', '暂时跳过')">暂时跳过</button>
    </div>
    </section>
<section id="context"><h2>文件大纲参考</h2><p>暂未稳定抽取出文件大纲，需要先补全文转述。</p>
    <div class="review-controls" data-section="context">
      <button onclick="setDecision('context', '无需处理')">无需处理</button>
      <button onclick="setDecision('context', '已补充修正')">已补充修正</button>
      <button onclick="setDecision('context', '暂时跳过')">暂时跳过</button>
    </div>
    </section>
      <section id="manual-feedback">
        <h2>人工修正</h2>
        <p class="muted">只在上方问题确实需要修正时填写。没有问题可以不处理。</p>
        <textarea id="manual-note" placeholder="例如：第 41 页表格第 3 列识别错了，正确内容是……"></textarea>
      </section>
    </main>
  </div>
  <script>
    const decisions = {};
    function setDecision(section, value) {
      decisions[section] = {
        "结论": value,
        "更新时间": new Date().toISOString()
      };
      document.getElementById('decision-json').value = JSON.stringify({
        "文件": "夏日城市清爽节",
        "确认意见": decisions,
        "人工补充": document.getElementById('manual-note') ? document.getElementById('manual-note').value : ""
      }, null, 2);
    }
    function downloadDecisions() {
      const payloadObject = {
        "文件": "夏日城市清爽节",
        "确认意见": decisions,
        "人工补充": document.getElementById('manual-note') ? document.getElementById('manual-note').value : ""
      };
      const payload = JSON.stringify(payloadObject, null, 2);
      const blob = new Blob([payload], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = 'review_decisions.json';
      anchor.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
